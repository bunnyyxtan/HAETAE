name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned near the local toolchain (nix forge 1.1.0-dev).
      # Change only with a LOG.md entry.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.1.0

      # Version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      # Node 22 per ARCHITECTURE.md stack table (services target Node 22).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: forge gates
        working-directory: contracts
        # Pinned toolchain: nix forge 1.1.0-dev — change only with a LOG.md entry.
        run: |
          forge fmt --check
          forge build
          forge test -vvv

      - name: typecheck
        # Root script, not `pnpm -r typecheck`: it builds the composite
        # lib/* declarations first (tsc --build), which leaf packages
        # reference. Bare recursive typecheck fails with TS6305 on a
        # fresh checkout because lib/*/dist does not exist yet.
        run: pnpm run typecheck

      - name: test
        run: pnpm -r test

  # Single-author + Conventional-subject law (RULES.md, S10). Platform pushes
  # that breach the law turn main red; next session's first duty: reshape.
  commit-law:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: enforce commit law
        run: |
          set -euo pipefail
          IDENT='bunnyyxtan <129172221+bunnyyxtan@users.noreply.github.com>'
          BEFORE='${{ github.event.before }}'
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            COMMITS=$(git rev-list -n 20 '${{ github.sha }}')
          else
            COMMITS=$(git rev-list "$BEFORE..${{ github.sha }}")
          fi
          FAIL=0
          for C in $COMMITS; do
            A=$(git show -s --format='%an <%ae>' "$C")
            M=$(git show -s --format='%cn <%ce>' "$C")
            S=$(git show -s --format='%s' "$C")
            if [ "$A" != "$IDENT" ] || [ "$M" != "$IDENT" ]; then
              echo "AUTHOR/COMMITTER BREACH $C: author='$A' committer='$M'"; FAIL=1
            fi
            if ! echo "$S" | grep -qE '^(feat|fix|docs|test|refactor|chore|ci|perf|style|build)(\([a-z0-9-]+\))?!?: .+' || [ "${#S}" -gt 72 ]; then
              echo "SUBJECT BREACH $C: '$S'"; FAIL=1
            fi
          done
          [ "$FAIL" = 0 ] || exit 1
          echo "commit law: all clear"
