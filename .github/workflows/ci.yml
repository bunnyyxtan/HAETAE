name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned to the local development toolchain.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.1.0

      - name: forge gates
        working-directory: contracts
        run: |
          forge fmt --check
          forge build
          forge test -vvv

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        working-directory: web
        run: npm ci

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      - name: test
        working-directory: web
        run: npm run test

      - name: build
        working-directory: web
        run: npm run build

  # Single-author, conventional-subject commit hygiene.
  commit-law:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: enforce commit law
        run: |
          set -euo pipefail
          IDENT='bunnyyxtan <129172221+bunnyyxtan@users.noreply.github.com>'
          BEFORE='${{ github.event.before }}'
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            COMMITS=$(git rev-list -n 20 '${{ github.sha }}')
          else
            COMMITS=$(git rev-list "$BEFORE..${{ github.sha }}")
          fi
          FAIL=0
          for C in $COMMITS; do
            A=$(git show -s --format='%an <%ae>' "$C")
            M=$(git show -s --format='%cn <%ce>' "$C")
            S=$(git show -s --format='%s' "$C")
            if [ "$A" != "$IDENT" ] || [ "$M" != "$IDENT" ]; then
              echo "AUTHOR/COMMITTER BREACH $C: author='$A' committer='$M'"; FAIL=1
            fi
            if ! echo "$S" | grep -qE '^(feat|fix|docs|test|refactor|chore|ci|perf|style|build)(\([a-z0-9-]+\))?!?: .+' || [ "${#S}" -gt 72 ]; then
              echo "SUBJECT BREACH $C: '$S'"; FAIL=1
            fi
            if echo "$S" | grep -q $'\u2014'; then
              echo "SUBJECT BREACH $C: em-dash in subject '$S'"; FAIL=1
            fi
          done
          [ "$FAIL" = 0 ] || exit 1
          echo "commit law: all clear"
